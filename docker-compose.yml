version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: dr_habibi_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-dr_habibi}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-dr_habibi}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: node:22-alpine
    container_name: dr_habibi_backend
    working_dir: /app/server
    command: sh -c "npm install && npx prisma generate && npx prisma db push && npm run dev"
    ports:
      - "5000:5000"
    volumes:
      - .:/app
    environment:
      - PORT=5000
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-dr_habibi}?schema=public
      - JWT_SECRET=${JWT_SECRET:-supersecretkey_dev}
      - S3_REGION=${S3_REGION}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    container_name: dr_habibi_frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
    environment:
      - DISABLE_HMR=${DISABLE_HMR}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - backend

volumes:
  postgres_data:
